<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prof. William Queiroz - Português Estratégico</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@600;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

      gtag('config', 'G-SEU_ID_AQUI');

    <style>
        :root {
            --azul-principal: #0B2240;
            --azul-profundo: #0D1B2A;
            --marca-ciano: #00D2CE;
            --marca-ciano-vibrante: #00B8B4;
            --superficie-clara: #F8FAFC;
            --texto-titulo: #1E293B;
            --texto-suporte: #64748B;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        h1, h2, h3, h4, .titulo-forte {
            font-family: 'Outfit', sans-serif;
        }

        body {
            background-color: var(--superficie-clara);
            color: var(--texto-titulo);
            line-height: 1.6;
            padding-top: 110px;
        }

        .area-restrita {
            max-width: 1140px;
            margin: 0 auto;
            padding: 0 24px;
        }

        /* --- TOPO INSTITUCIONAL --- */
        .barra-topo {
            background-color: #ffffff;
            padding: 18px 0;
            box-shadow: 0 4px 20px rgba(0,0,0,0.02);
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 100;
            transition: transform 0.3s ease, opacity 0.3s ease;
        }

        .barra-topo.escondida {
            transform: translateY(-100%);
            opacity: 0;
            pointer-events: none;
        }

        .alinhamento-topo {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .bloco-marca h1 {
            font-size: 18px;
            font-weight: 900;
            color: var(--azul-principal);
            text-transform: uppercase;
            letter-spacing: -0.5px;
        }

        .bloco-marca p {
            font-size: 11px;
            color: var(--texto-suporte);
            font-weight: 500;
        }

        .bloco-marca .tagline {
            font-size: 10px;
            color: var(--marca-ciano);
            font-weight: 800;
            text-transform: uppercase;
            margin-top: 2px;
        }

        .menu-navegacao a {
            text-decoration: none;
            color: var(--texto-titulo);
            font-size: 13px;
            font-weight: 600;
            margin: 0 18px;
            transition: color 0.2s ease;
        }

        .menu-navegacao a:hover {
            color: var(--marca-ciano);
        }

        .chamada-topo {
            background-color: var(--azul-principal);
            color: #ffffff;
            text-decoration: none;
            font-size: 11px;
            font-weight: 700;
            padding: 12px 22px;
            border-radius: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: transform 0.2s ease;
            text-align: center;
        }

        .chamada-topo:hover {
            transform: translateY(-2px);
        }

        /* --- SEÇÃO 1: CAPTURA DE LEADS --- */
        .bloco-captura {
            background: linear-gradient(135deg, #ffffff 0%, #E2F8F7 100%);
            padding: 50px 0;
            border-bottom: 1px solid rgba(0, 210, 206, 0.1);
        }

        .layout-captura {
            display: flex;
            align-items: center;
            gap: 40px;
            flex-wrap: wrap;
        }

        .info-captura {
            width: 100%;
        }

        .info-captura h2 {
            font-size: 32px;
            color: var(--azul-principal);
            font-weight: 800;
            line-height: 1.2;
            margin-bottom: 15px;
        }

        .info-captura h2 span {
            color: var(--marca-ciano-vibrante);
            display: inline-block;
        }

        .info-captura p {
            color: var(--texto-titulo);
            font-size: 15px;
            margin-bottom: 20px;
        }

        .formulario-lead {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .formulario-lead input {
            flex: 1;
            min-width: 200px;
            padding: 14px 20px;
            border: 2px solid rgba(11, 34, 64, 0.1);
            border-radius: 8px;
            font-size: 14px;
            outline: none;
        }

        .formulario-lead input:focus {
            border-color: var(--marca-ciano);
        }

        .btn-enviar-lead {
            background-color: var(--azul-principal);
            color: #fff;
            border: none;
            padding: 14px 28px;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            text-transform: uppercase;
            font-size: 13px;
            transition: background 0.2s;
        }

        .btn-enviar-lead:hover {
            background-color: var(--azul-profundo);
        }

        /* Estilo auxiliar para garantir a responsividade do iframe incorporado */
        .google-form-container {
            width: 100%;
            max-width: 640px;
            margin-top: 10px;
        }

        .google-form-container iframe {
            width: 100%;
            border: none;
        }

        /* --- SEÇÃO 2: VITRINE PRINCIPAL --- */
        .secao-principal {
            padding: 60px 0;
            display: flex;
            flex-wrap: wrap-reverse;
            align-items: center;
        }

        .lado-esquerdo {
            flex: 1;
            min-width: 300px;
            padding-right: 20px;
        }

        .lado-direito {
            flex: 1;
            min-width: 300px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .secao-principal h2 {
            font-size: 44px;
            font-weight: 900;
            color: var(--azul-principal);
            line-height: 1.1;
            margin-bottom: 25px;
            letter-spacing: -1px;
        }

        .secao-principal h2 span {
            color: var(--marca-ciano);
        }

        .wrapper-apresentacao {
            display: flex;
            gap: 25px;
            margin-bottom: 25px;
            align-items: center;
        }

        .arte-principal {
            width: 170px;
            height: auto;
            border-radius: 12px;
            box-shadow: 0 12px 24px rgba(13, 27, 42, 0.15);
        }

        .texto-principal {
            font-size: 14px;
            color: var(--texto-titulo);
            font-weight: 400;
            flex: 1;
        }

        .btn-acao-vendas {
            display: inline-block;
            background-color: var(--marca-ciano);
            color: #ffffff;
            text-decoration: none;
            font-weight: 700;
            font-size: 14px;
            padding: 16px 48px;
            border-radius: 8px;
            text-transform: uppercase;
            box-shadow: 0 6px 20px rgba(0, 210, 206, 0.25);
            transition: all 0.2s;
            border: none;
            cursor: pointer;
        }

        .btn-acao-vendas:hover {
            background-color: var(--marca-ciano-vibrante);
            transform: translateY(-2px);
        }

        .molde-foto {
            width: 330px;
            height: 330px;
            background: linear-gradient(45deg, #E2F8F7, #ffffff);
            border-radius: 24px;
            position: relative;
            box-shadow: 0 20px 40px rgba(0,0,0,0.03);
        }

        .imagem-mestre {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 95%;
            height: auto;
        }

        /* --- PAINEL DE VANTAGENS --- */
        .painel-vantagens {
            background-color: var(--azul-principal);
            border-radius: 16px;
            padding: 30px;
            display: flex;
            justify-content: space-around;
            flex-wrap: wrap;
            gap: 24px;
            margin-top: 20px;
            box-shadow: 0 15px 35px rgba(11, 34, 64, 0.15);
        }

        .item-vantagem {
            display: flex;
            align-items: center;
            gap: 16px;
            color: #ffffff;
            max-width: 280px;
        }

        .item-vantagem i {
            font-size: 26px;
            color: var(--marca-ciano);
        }

        .texto-vantagem h4 {
            font-size: 14px;
            font-weight: 700;
        }

        .texto-vantagem p {
            font-size: 12px;
            color: #94A3B8;
        }

        /* --- TÍTULOS --- */
        .rotulo-secao {
            text-align: center;
            font-size: 28px;
            font-weight: 800;
            color: var(--azul-principal);
            margin: 80px 0 40px 0;
            position: relative;
        }

        /* --- MURAL DE VÍDEOS --- */
        .mural-videos {
            display: flex;
            flex-wrap: wrap;
            gap: 24px;
            justify-content: center;
        }

        .card-multimidia {
            background: #ffffff;
            border-radius: 16px;
            overflow: hidden;
            width: calc(25% - 18px);
            min-width: 260px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.03);
            transition: transform 0.2s;
        }

        .card-multimidia:hover {
            transform: translateY(-4px);
        }

        .player-video {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%;
            height: 0;
            background-color: #000;
        }

        .player-video iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }

        .detalhe-video {
            padding: 18px;
        }

        .detalhe-video h3 {
            font-size: 14px;
            font-weight: 700;
            color: var(--azul-principal);
            margin-bottom: 6px;
        }

        .detalhe-video p {
            font-size: 12px;
            color: var(--texto-suporte);
        }

        /* --- HUB DE PRODUTOS --- */
        .hub-produtos {
            display: flex;
            flex-wrap: wrap;
            gap: 24px;
            justify-content: center;
            margin-bottom: 40px;
        }

        .box-oferta {
            background: #ffffff;
            border-radius: 16px;
            padding: 28px 20px;
            width: calc(33.333% - 16px);
            min-width: 280px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.02);
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            border: 1px solid rgba(0,0,0,0.03);
        }

        .capa-produto {
            width: 100%;
            max-width: 160px;
            height: auto;
            border-radius: 8px;
            margin-bottom: 18px;
            box-shadow: 0 6px 15px rgba(0,0,0,0.06);
        }

        .box-oferta h3 {
            font-size: 16px;
            font-weight: 800;
            color: var(--azul-principal);
            margin-bottom: 6px;
            min-height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .box-oferta .legenda-oferta {
            font-size: 12px;
            color: var(--texto-suporte);
            margin-bottom: 15px;
        }

        .aviso-direcionamento {
            font-size: 14px;
            font-weight: 700;
            color: #E11D48;
            background-color: #FFF1F2;
            padding: 12px 15px;
            border-radius: 8px;
            border: 1px solid #FFE4E6;
            margin-top: auto;
            margin-bottom: 10px;
            line-height: 1.4;
        }

        .valor-tag {
            font-size: 20px;
            font-weight: 800;
            color: var(--azul-principal);
            margin-bottom: 15px;
            margin-top: auto;
        }

        .valor-subtag {
            font-size: 11px;
            color: var(--texto-suporte);
            text-transform: uppercase;
            font-weight: 700;
            margin-top: -12px;
            margin-bottom: 15px;
        }

        .status-vagas {
            font-size: 13px;
            font-weight: 600;
            color: #E11D48;
            margin-bottom: 15px;
            margin-top: auto;
        }

        .box-oferta .btn-acao-vendas {
            width: 100%;
            padding: 12px 20px;
            font-size: 12px;
            margin-top: auto;
        }

        /* --- CARD DE DOWNLOAD FINAL --- */
        .secao-download-final {
            margin-bottom: 80px;
            display: flex;
            justify-content: center;
        }

        .card-download-exclusivo {
            background: linear-gradient(135deg, #ffffff 0%, #E2F8F7 100%);
            border: 2px dashed var(--marca-ciano);
            border-radius: 20px;
            padding: 40px 30px;
            text-align: center;
            max-width: 600px;
            width: 100%;
            box-shadow: 0 15px 35px rgba(0, 210, 206, 0.1);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }

        .card-download-exclusivo h3 {
            font-size: 24px;
            color: var(--azul-principal);
            font-weight: 800;
        }

        .card-download-exclusivo p {
            font-size: 14px;
            color: var(--texto-titulo);
            max-width: 450px;
        }

        /* --- SISTEMA DE COMENTÁRIOS --- */
        .area-comentarios {
            background-color: #ffffff;
            border-radius: 16px;
            padding: 30px;
            margin-bottom: 80px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.02);
        }

        .form-comentario {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 30px;
        }

        .form-comentario textarea {
            width: 100%;
            padding: 15px;
            border: 2px solid rgba(11, 34, 64, 0.1);
            border-radius: 8px;
            resize: none;
            height: 100px;
            font-size: 14px;
        }

        .linha-inputs {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .linha-inputs input {
            flex: 1;
            min-width: 200px;
            padding: 12px 15px;
            border: 2px solid rgba(11, 34, 64, 0.1);
            border-radius: 8px;
        }

        .btn-comentar {
            align-self: flex-end;
            background-color: var(--azul-principal);
            color: #ffffff;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            font-weight: 700;
            cursor: pointer;
            font-size: 13px;
        }

        .lista-comentarios .item-comentario {
            border-top: 1px solid #EDF2F7;
            padding: 18px 0;
        }

        .item-comentario h4 {
            font-size: 14px;
            color: var(--azul-principal);
            margin-bottom: 4px;
        }

        .item-comentario p {
            font-size: 13px;
            color: var(--texto-titulo);
        }

        /* --- FOOTER --- */
        footer {
            background-color: var(--azul-principal);
            color: #ffffff;
            padding: 50px 0 25px 0;
            font-size: 13px;
        }

        .canais-comunicacao {
            display: flex;
            justify-content: center;
            gap: 35px;
            flex-wrap: wrap;
            margin-bottom: 30px;
        }

        .canais-comunicacao a {
            color: #E2E8F0;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: color 0.2s;
        }

        .canais-comunicacao a:hover {
            color: var(--marca-ciano);
        }

        .perfil-instagram {
            text-align: center;
            margin-bottom: 30px;
        }

        .link-destacado {
            font-weight: 600;
            color: #ffffff;
            text-decoration: none;
        }

        .assinatura-professor {
            text-align: center;
            font-weight: 600;
            font-size: 14px;
            margin-bottom: 35px;
        }

        .assinatura-professor span {
            color: var(--marca-ciano);
        }

        .direitos-reservados {
            border-top: 1px solid rgba(255,255,255,0.08);
            padding-
